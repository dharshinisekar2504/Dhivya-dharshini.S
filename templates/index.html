<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ComicCraft</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<div class="container">

    <div class="hero">

        <h1>ComicCraft</h1>

        <p>
            AI Comic Story Creator using Gemini Models
        </p>

    </div>


    <div class="card">

        <h2>Create Your Comic</h2>


        <form
            action="/generate"
            method="post"
        >

            <label>
                Story Prompt
            </label>

            <textarea
                name="prompt"
                required
                placeholder="Example: A young inventor discovers a mysterious robot..."
            ></textarea>


            <label>
                Main Character Name
            </label>

            <input
                type="text"
                name="character_name"
                required
                placeholder="Example: Maya"
            >


            <label>
                Setting
            </label>

            <input
                type="text"
                name="setting"
                required
                placeholder="Example: A futuristic city"
            >


            <label>
                Tone
            </label>

            <select name="tone">

                <option>
                    Adventure
                </option>

                <option>
                    Funny
                </option>

                <option>
                    Mystery
                </option>

                <option>
                    Fantasy
                </option>

                <option>
                    Science Fiction
                </option>

                <option>
                    Inspirational
                </option>

            </select>


            <label>
                Art Style
            </label>

            <select name="art_style">

                <option>
                    comic book
                </option>

                <option>
                    cartoon
                </option>

                <option>
                    manga
                </option>

                <option>
                    graphic novel
                </option>

                <option>
                    watercolor comic
                </option>

            </select>


            <button type="submit">
                Generate Comic
            </button>

        </form>

    </div>

</div>

</body>

</html>
